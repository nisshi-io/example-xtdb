server:
  port: 5432

log: !Kafka
  bootstrapServers: !Env "KAFKA_BOOTSTRAP_SERVERS"
  topic: !Env "XTDB_LOG_TOPIC"
  autoCreateTopic: true

storage: !Remote
  objectStore: !S3
    bucket: !Env "XTDB_S3_BUCKET"
    endpoint: !Env "XTDB_S3_ENDPOINT"
    credentials:
      accessKey: !Env "XTDB_S3_ACCESS_KEY"
      secretKey: !Env "XTDB_S3_SECRET_KEY"
    pathStyleAccessEnabled: true
  localDiskCache: /var/lib/xtdb/buffers

healthz:
  port: 8080

modules:
  - !HttpServer
    port: 3000
